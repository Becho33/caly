{% extends "base.html" %}

{% block title %}Add Booking{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title">Add Appointment</h2>
                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label" for="customer-name">Customer Name</label>
                        <input class="form-control" id="customer-name" type="text" name="customer_name" value="{{ form_data.get('customer_name', '') }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="customer-phone">Phone Number</label>
                        <input class="form-control" id="customer-phone" type="tel" name="phone" value="{{ form_data.get('phone', '') }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="booking-start">Appointment Time</label>
                        <input class="form-control" id="booking-start" type="datetime-local" name="start_time" value="{{ start_value }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="booking-duration">Appointment Length (Minutes)</label>
                        <input class="form-control" id="booking-duration" type="number" min="1" name="duration" value="{{ form_data.get('duration', '') }}" required>
                    </div>

                    <div class="row">
                        <div class="mb-3 col-md-6">
                            <label class="form-label" for="booking-staff">Assigned staff member</label>
                            <select class="form-select" id="booking-staff" name="staff_id">
                                    <option value="">Not assigned yet</option>
                                    {% for s in staff_members %}
                                        <option value="{{ s.id }}" {% if form_data.get('staff_id')|string == s.id|string %}selected{% endif %} title="{{ staff_avail.get(s.id, '') }}">{{ s.name }}{% if staff_avail.get(s.id) %} — {{ staff_avail[s.id][:30] }}{% if staff_avail[s.id]|length > 30 %}...{% endif %}{% endif %}</option>
                                    {% endfor %}
                                </select>
                        </div>
                        <div class="mb-3 col-md-6">
                            <label class="form-label" for="booking-paid">Payment status</label>
                            <select class="form-select" id="booking-paid" name="paid">
                                    <option value="yes" {% if form_data.get('paid', 'yes') == 'yes' %}selected{% endif %}>Paid</option>
                                    <option value="no" {% if form_data.get('paid') == 'no' %}selected{% endif %}>Not Paid</option>
                                    <option value="group" {% if form_data.get('paid') == 'group' %}selected{% endif %}>Groupon Voucher</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="booking-location">Location</label>
                        <input class="form-control" id="booking-location" type="text" name="location" value="{{ form_data.get('location', '') }}" placeholder="e.g. Brighton Clinic">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save Booking</button>
                        <a href="{{ url_for('calendar') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
