{% extends "base.html" %}

{% block title %}Reveal Personal Details{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="auth-card card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="auth-icon">🔒</div>
                    <h1 class="h3 mb-2">Reveal Personal Details</h1>
                    <p class="text-muted mb-0">Enter the privacy password to show customer and staff contact details.</p>
                </div>
                <form method="post">
                    <input type="hidden" name="next" value="{{ next_url }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold" for="reveal-password">Password</label>
                        <input class="form-control form-control-lg" id="reveal-password" type="password" name="password" autocomplete="current-password" required autofocus>
                    </div>
                    <div class="d-flex gap-2 justify-content-center">
                        <button class="btn btn-primary" type="submit">Reveal Details</button>
                        <a class="btn btn-outline-secondary" href="{{ next_url }}">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
